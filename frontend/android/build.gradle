// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // @capgo/capacitor-social-login compiles against androidx.browser 1.9.0 (compileOnly, because
    // the Apple provider is disabled in capacitor.config.json) while its Google dependency
    // (androidbrowserhelper) pulls 1.4.0 at runtime; Gradle's consistent resolution then fails.
    // One version for everything fixes it. 1.8.0, not 1.9.0: 1.9.0 requires compileSdk 36 and
    // this project (AGP 8.7) compiles against 35.
    configurations.all {
        resolutionStrategy.force 'androidx.browser:browser:1.8.0'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
